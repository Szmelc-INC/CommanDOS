List All Boot Entries : bcdedit /enum firmware

List Boot Entries (with Identifier & Description) : bcdedit /enum firmware | Select-String "identifier|description"

Add Custom UEFI Boot Entry : $desc = Read-Host "Enter boot entry description"; $path = Read-Host "Enter path to EFI file (e.g. \EFI\Custom\bootx64.efi)"; bcdedit /create /d "$desc" /application BOOTSECTOR

Delete UEFI Boot Entry : $id = Read-Host "Enter identifier (e.g. {xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx})"; bcdedit /delete $id /f

Change Boot Order (Move Entry to Top) : $id = Read-Host "Enter boot identifier to move first"; $current = bcdedit /enum firmware | Select-String "identifier" | ForEach-Object { ($_ -replace "identifier *", "").Trim() }; $new = "$id " + ($current -ne $id -join " "); bcdedit /set {fwbootmgr} displayorder $new

Enable Secure Boot (if supported) : Confirm-SecureBootUEFI; if ($?) { Write-Host "Secure Boot already enabled or supported." } else { Write-Host "Secure Boot change must be done via firmware/BIOS GUI." -ForegroundColor Yellow }

Check Secure Boot State : Confirm-SecureBootUEFI | ForEach-Object { if ($_ -eq $true) { "✅ Secure Boot is ENABLED" } else { "❌ Secure Boot is DISABLED or UNSUPPORTED" } }

Check if System Booted in UEFI Mode : if ((Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control" -Name PEFirmwareType -ErrorAction SilentlyContinue).PEFirmwareType -eq 2) { "✅ UEFI Mode" } else { "❌ Legacy BIOS Mode" }

Query Current Boot Mode via WMI : Get-WmiObject -Namespace root\wmi -Class MS_SystemInformation | Select BaseBoardProduct, BiosVersion, BiosCharacteristics, SystemSkuNumber | Format-List

Dump All UEFI NVRAM Variables : Get-CimInstance -Namespace root\wmi -ClassName MSFT_EFIVariable | Format-List

Search for Specific UEFI Variable : $n = Read-Host "Enter variable name"; Get-CimInstance -Namespace root\wmi -ClassName MSFT_EFIVariable | Where-Object { $_.Name -like "*$n*" } | Format-List

Delete UEFI Variable by Name : $n = Read-Host "Enter EFI variable name to delete"; Remove-EFIVariable -Name $n -Namespace "{00000000-0000-0000-0000-000000000000}"

Set Custom UEFI Variable : $n = Read-Host "Enter variable name"; $v = Read-Host "Enter value (as byte array, e.g. 01 00 00 00)"; $bytes = [byte[]]($v -split " "); Set-EFIVariable -Name $n -Value $bytes -Namespace "{00000000-0000-0000-0000-000000000000}"

Reboot to UEFI Firmware Settings : shutdown /r /fw /t 0

List All BCD Stores (Global) : bcdedit /enum all

Repair EFI Bootloader (Advanced) : $p = Read-Host "Enter EFI partition letter (e.g. S:)"; bcdboot C:\Windows /s "$p" /f UEFI

Mount EFI System Partition (ESP) : $disk = Get-Disk | Out-GridView -Title "Select Disk" -PassThru; if ($disk) { $vol = Get-Partition -DiskNumber $disk.Number | Where-Object { $_.GptType -eq "c12a7328-f81f-11d2-ba4b-00a0c93ec93b" }; if ($vol) { $letter = Read-Host "Enter drive letter to assign (e.g. S)"; Set-Partition -PartitionNumber $vol.PartitionNumber -DiskNumber $disk.Number -NewDriveLetter $letter } }

Unmount EFI Partition : $l = Read-Host "Enter drive letter (e.g. S)"; Remove-PSDrive $l -Force

Backup Current BCD : bcdedit /export "$env:SystemDrive\bcd_backup.bak"; Write-Host "✔ Backup saved to bcd_backup.bak"

Restore BCD from Backup : bcdedit /import "$env:SystemDrive\bcd_backup.bak"
