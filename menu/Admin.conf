Open PowerShell as Administrator : Start-Process powershell -Verb RunAs
Open CMD as Administrator : Start-Process cmd -Verb RunAs
Computer Management : Start-Process compmgmt.msc
Services : Start-Process services.msc
Event Viewer : Start-Process eventvwr.msc
Group Policy Editor : Start-Process gpedit.msc
Registry Editor : Start-Process regedit
Local Users and Groups : Start-Process lusrmgr.msc
Disk Management : Start-Process diskmgmt.msc
Device Manager : Start-Process devmgmt.msc
System Configuration (msconfig) : Start-Process msconfig
Windows Firewall Settings : Start-Process wf.msc
Task Scheduler : Start-Process taskschd.msc
Advanced System Settings : SystemPropertiesAdvanced
Environment Variables Editor : rundll32 sysdm.cpl,EditEnvironmentVariables
Check Disk on C: : chkdsk C: /f /r
SFC Scan (System File Check) : sfc /scannow
DISM Health Check : DISM /Online /Cleanup-Image /ScanHealth
DISM Restore Health : DISM /Online /Cleanup-Image /RestoreHealth
View Open Ports & Connections : netstat -abno
Reset Network Stack : netsh int ip reset && netsh winsock reset
Exit : exit
