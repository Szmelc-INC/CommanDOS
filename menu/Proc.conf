List All Processes (Name, ID, Path) : Get-Process | Select-Object Name, Id, Path | Format-Table -AutoSize

Select Process and Dump Full Info : $p = Get-Process | Out-GridView -Title 'Select Process to Inspect' -PassThru; if ($p) { $p | Format-List *; Get-Process -Id $p.Id -IncludeUserName | Format-List }

Open Process File Location : $p = Get-Process | Where-Object { $_.Path } | Out-GridView -Title 'Select Process to Reveal in Explorer' -PassThru; if ($p) { Start-Process explorer "/select,`"$($p.Path)`"" }

Freeze Process (Suspend) : $p = Get-Process | Out-GridView -Title 'Select Process to Suspend' -PassThru; if ($p) { Suspend-Process -Id $p.Id }

Unfreeze Process (Resume) : $p = Get-Process | Out-GridView -Title 'Select Process to Resume' -PassThru; if ($p) { Resume-Process -Id $p.Id }

Stop (Graceful) Process : $p = Get-Process | Out-GridView -Title 'Select Process to Stop' -PassThru; if ($p) { Stop-Process -Id $p.Id -Force -Confirm:$false }

Absolutely Annihilate Process (WMI Terminate) : $p = Get-Process | Out-GridView -Title 'Select Process to KILL HARD' -PassThru; if ($p) { Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" | Invoke-CimMethod -MethodName Terminate }

Start New Process by Path : $exe = Read-Host 'Enter full path or executable name'; if ($exe) { Start-Process "$exe" }

Restart Process as Administrator : $p = Get-Process | Out-GridView -Title 'Select Process to Restart as Admin' -PassThru; if ($p -and $p.Path) { Stop-Process -Id $p.Id -Force; Start-Process "$($p.Path)" -Verb RunAs }

Show Process Event Logs : $p = Get-Process | Out-GridView -Title 'Select Process for Event Logs' -PassThru; if ($p) { Get-WinEvent -LogName System | Where-Object { $_.Message -like "*$($p.Name)*" } | Format-List TimeCreated, Id, LevelDisplayName, Message }

Show Process Network Activity : $p = Get-Process | Out-GridView -Title 'Select Process for Network Info' -PassThru; if ($p) { Get-NetTCPConnection | Where-Object { $_.OwningProcess -eq $p.Id } | Format-Table LocalAddress, LocalPort, RemoteAddress, RemotePort, State }

Inject DLL into Process (Manual Entry) : $p = Get-Process | Out-GridView -Title 'Select Target Process' -PassThru; $dll = Read-Host 'Enter DLL Path'; if ($p -and $dll) { Write-Host "→ You must use an external tool to inject: $dll into PID $($p.Id)" -ForegroundColor Yellow }

Modify Process Memory (Manual Tools) : Write-Host '→ Use Cheat Engine, Process Hacker, or Process Explorer to modify memory.' -ForegroundColor Yellow

Dump Process Memory to File : $p = Get-Process | Out-GridView -Title 'Select Process to Dump Memory' -PassThru; if ($p) { $out = Read-Host 'Enter output file path (.dmp)'; if ($out) { procdump -ma $($p.Id) "$out" } }

List All Services (with PID) : Get-Service | ForEach-Object { $svc = Get-WmiObject Win32_Service -Filter "Name='$_'"; [PSCustomObject]@{ Name = $_.DisplayName; Status = $_.Status; PID = $svc.ProcessId } } | Format-Table -AutoSize

Restart explorer.exe : Stop-Process -Name explorer -Force; Start-Process explorer
