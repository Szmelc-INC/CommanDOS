List All Processes (Name, ID, Path) : powershell -Command 'Get-Process | Select-Object Name, Id, Path | Format-Table -AutoSize'
Select Process and Dump Full Info : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Inspect" -PassThru; if ($p) { $p | Format-List *; Get-Process -Id $p.Id -IncludeUserName | Format-List; }'
Open Process File Location : powershell -Command '$p = Get-Process | Where-Object { $_.Path } | Out-GridView -Title "Select Process to Reveal in Explorer" -PassThru; if ($p) { Start-Process explorer "/select,`"$($p.Path)`"" }'
Freeze Process (Suspend) : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Suspend" -PassThru; if ($p) { Suspend-Process -Id $p.Id }'
Unfreeze Process (Resume) : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Resume" -PassThru; if ($p) { Resume-Process -Id $p.Id }'
Stop (Graceful) Process : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Stop" -PassThru; if ($p) { Stop-Process -Id $p.Id -Force -Confirm:$false }'
Absolutely Annihilate Process (Kill via WMI) : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Kill HARD" -PassThru; if ($p) { Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" | Invoke-CimMethod -MethodName Terminate }'
Start New Process by Path : powershell -Command '$p = Read-Host "Enter full path or executable name"; if ($p) { Start-Process "$p" }'
Restart Process as Administrator : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Restart as Admin" -PassThru; if ($p -and $p.Path) { Stop-Process -Id $p.Id -Force; Start-Process "$($p.Path)" -Verb RunAs }'
Show Process Event Logs : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to View Logs" -PassThru; if ($p) { Get-WinEvent -LogName System | Where-Object { $_.Message -like "*$($p.Name)*" } | Format-List -Property TimeCreated, Id, LevelDisplayName, Message }'
Show Process Network Activity : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process for Network Info" -PassThru; if ($p) { Get-NetTCPConnection | Where-Object { $_.OwningProcess -eq $p.Id } | Format-Table -AutoSize }'
Inject DLL into Process (Manual Entry) : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process for DLL Injection" -PassThru; $dll = Read-Host "Enter full path to DLL"; if ($p -and $dll) { Write-Host "→ You will need external tools like WriteProcessMemory / LoadLibraryA to inject: $dll into PID $($p.Id)" -ForegroundColor Yellow }'
Modify Process Memory (Warning: Placeholder) : powershell -Command 'Write-Host "→ Use tools like Cheat Engine, Process Hacker or Scylla to modify memory in process space." -ForegroundColor Yellow'
Dump Process Memory to File : powershell -Command '$p = Get-Process | Out-GridView -Title "Select Process to Dump Memory" -PassThru; if ($p) { $out = Read-Host "Enter output file path (.dmp)"; if ($out) { procdump -ma $($p.Id) "$out" } else { Write-Host "Invalid path." } }'
List All Services (w/ Associated Process ID) : powershell -Command 'Get-Service | ForEach-Object { $proc = (Get-WmiObject Win32_Service -Filter "Name=''$($_.Name)''"); [PSCustomObject]@{ Name=$_.DisplayName; Status=$_.Status; PID=$proc.ProcessId } } | Format-Table -AutoSize'
Restart Explorer.exe : powershell -Command 'Stop-Process -Name explorer -Force; Start-Process explorer'
