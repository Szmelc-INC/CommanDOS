Show IP Configuration : ipconfig /all | more
Release IP Address : ipconfig /release
Renew IP Address : ipconfig /renew
Flush DNS Cache : ipconfig /flushdns
Display DNS Cache : ipconfig /displaydns
Test DNS with nslookup : nslookup szmelc.com
Ping Google : ping 8.8.8.8
Traceroute to Google : tracert google.com
Check Open Ports : netstat -an | more
View Programs Using Ports : netstat -abno | more
Show ARP Cache : arp -a
List Network Interfaces : netsh interface show interface
Reset TCP/IP Stack : netsh int ip reset
Reset Winsock : netsh winsock reset
Show Wireless Profiles : netsh wlan show profiles
Show Current Wi-Fi Password : netsh wlan show profile name="Wi-Fi" key=clear
Enable Network Adapter : netsh interface set interface "Ethernet" admin=enabled
Disable Network Adapter : netsh interface set interface "Ethernet" admin=disabled
Check Internet Speed (browser) : Start-Process https://fast.com
Open Network Connections GUI : Start-Process ncpa.cpl
Open Firewall Settings : Start-Process wf.msc
Run PowerShell Network Test : Test-NetConnection google.com
Exit : exit
