Open Command Prompt : start cmd
Open PowerShell : start powershell
System Information : systeminfo | more
Task Manager : Start-Process taskmgr
Device Manager : Start-Process devmgmt.msc
Network Connections : Start-Process ncpa.cpl
Control Panel : Start-Process control
Windows Update : Start-Process ms-settings:windowsupdate
Open Startup Folder : Start-Process shell:startup
Show IP Configuration : ipconfig /all | more
Flush DNS Cache : ipconfig /flushdns
Ping Google : ping 8.8.8.8
Open Hosts File (Admin) : Start-Process notepad "C:\Windows\System32\drivers\etc\hosts"
List Running Tasks : tasklist
Kill Task by Name (e.g. notepad.exe) : taskkill /IM notepad.exe /F
Restart Explorer : Stop-Process -Name explorer -Force; Start-Process explorer
Shut Down Computer : shutdown /s /t 5
Restart Computer : shutdown /r /t 5
Lock Computer : rundll32.exe user32.dll,LockWorkStation
Exit : exit
