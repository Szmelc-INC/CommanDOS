### ─── Admin Launchers ────────────────────────────────────────────────
Open PowerShell as Administrator : Start-Process powershell -Verb RunAs
Open CMD as Administrator : Start-Process cmd -Verb RunAs
Open Registry Editor : regedit
Open Task Manager : Start-Process taskmgr
Open Group Policy Editor : Start-Process gpedit.msc

### ─── Ownership & Permissions ────────────────────────────────────────
Take Ownership of Path (Recursive) : powershell -Command "$p=Read-Host 'Enter path'; takeown /f \"$p\" /r /d Y"
Grant Full Access to Everyone (Recursive) : powershell -Command "$p=Read-Host 'Enter path'; icacls \"$p\" /grant Everyone:F /T /C /Q"
Set Ownership to Administrators : powershell -Command "$p=Read-Host 'Enter path'; icacls \"$p\" /setowner 'Administrators' /T /C /Q"
Remove Inherited Permissions : powershell -Command "$p=Read-Host 'Enter path'; icacls \"$p\" /inheritance:d /T /C /Q"
Reset Permissions to Default : powershell -Command "$p=Read-Host 'Enter path'; icacls \"$p\" /reset /T /C /Q"
Deny Everyone Access (Lockdown) : powershell -Command "$p=Read-Host 'Enter path'; icacls \"$p\" /deny Everyone:F /T /C /Q"

### ─── Visibility / Explorer Tweaks ───────────────────────────────────
Show Hidden + System Files : powershell -Command "Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name Hidden -Value 1; Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name ShowSuperHidden -Value 1; Stop-Process -Name explorer -Force"
Hide Hidden + System Files : powershell -Command "Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name Hidden -Value 2; Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name ShowSuperHidden -Value 0; Stop-Process -Name explorer -Force"
Toggle File Extensions Visibility : powershell -Command "$x=(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced').HideFileExt; Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name HideFileExt -Value ($x -bxor 1); Stop-Process -Name explorer -Force"

### ─── Metadata / Forensics / Listings ───────────────────────────────
Dump Full Metadata of File/Folder : powershell -Command "$p=Read-Host 'Enter path'; Get-Item \"$p\" | Format-List *; Get-Acl \"$p\" | Format-List"
Get Owner and Inherited Permissions : powershell -Command "$p=Read-Host 'Enter path'; Get-Acl \"$p\" | Select Owner, AccessToString | Format-List"
List All Files Recursively : powershell -Command "$p=Read-Host 'Enter path'; Get-ChildItem \"$p\" -Recurse -Force"
List All Hidden Files : powershell -Command "$p=Read-Host 'Enter path'; Get-ChildItem \"$p\" -Recurse -Force | Where-Object { $_.Attributes -match 'Hidden' }"
List All System Files : powershell -Command "$p=Read-Host 'Enter path'; Get-ChildItem \"$p\" -Recurse -Force | Where-Object { $_.Attributes -match 'System' }"
List All Files With Deny ACEs : powershell -Command "$p=Read-Host 'Enter path'; Get-ChildItem \"$p\" -Recurse -Force | Where-Object { (Get-Acl $_.FullName).Access | Where-Object { $_.AccessControlType -eq 'Deny' } }"
List All Non-Inherited ACLs : powershell -Command "$p=Read-Host 'Enter path'; Get-ChildItem \"$p\" -Recurse -Force | Where-Object { !(Get-Acl $_.FullName).AreAccessRulesProtected }"

### ─── File Operations / Mass Actions ────────────────────────────────
Unlock Attributes (Clear R, H, S) : powershell -Command "$p=Read-Host 'Enter path'; attrib -r -h -s \"$p\" /s /d"
Permanently Delete Path (No Recycle Bin) : powershell -Command "$p=Read-Host 'Enter path'; Remove-Item \"$p\" -Recurse -Force -Confirm:\$false"
Copy Entire Directory : powershell -Command "$src=Read-Host 'Source path'; $dst=Read-Host 'Destination path'; Copy-Item \"$src\" -Destination \"$dst\" -Recurse -Force"
Move Entire Directory : powershell -Command "$src=Read-Host 'Source path'; $dst=Read-Host 'Destination path'; Move-Item \"$src\" -Destination \"$dst\" -Force"

### ─── Registry & Policies ───────────────────────────────────────────
Disable USB Storage Access : powershell -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR' -Name Start -Value 4"
Enable USB Storage Access : powershell -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR' -Name Start -Value 3"
Disable Task Manager : powershell -Command "Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System' -Name DisableTaskMgr -Value 1"
Enable Task Manager : powershell -Command "Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System' -Name DisableTaskMgr -ErrorAction SilentlyContinue"

### ─── Explorer Context Debug ────────────────────────────────────────
Show Open With Dialog : powershell -Command "$p=Read-Host 'Enter file path'; rundll32.exe shell32.dll,OpenAs_RunDLL $p"
Open File Properties Window : powershell -Command "$p=Read-Host 'Enter file path'; (New-Object -ComObject Shell.Application).Namespace((Split-Path $p)).ParseName((Split-Path $p -Leaf)).InvokeVerb('Properties')"
