Take Ownership of Path (Recursive) : $p=Read-Host "Enter path"; takeown /f "$p" /r /d Y

Grant Full Access to Specific User/Group : $p=Read-Host "Enter path"; $u=Read-Host "Enter user or group (e.g. Everyone)"; icacls "$p" /grant "$u":F /T /C /Q

Set Ownership to Specific User/Group : $p=Read-Host "Enter path"; $u=Read-Host "Enter new owner (user or group)"; icacls "$p" /setowner "$u" /T /C /Q

Remove Inherited Permissions : $p=Read-Host "Enter path"; icacls "$p" /inheritance:d /T /C /Q

Reset Permissions to Default : $p=Read-Host "Enter path"; icacls "$p" /reset /T /C /Q

Deny Access to Specific User/Group : $p=Read-Host "Enter path"; $u=Read-Host "Enter user or group to deny"; icacls "$p" /deny "$u":F /T /C /Q

Show Hidden + System Files : Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name Hidden -Value 1; Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name ShowSuperHidden -Value 1; Stop-Process -Name explorer -Force

Hide Hidden + System Files : Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name Hidden -Value 2; Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name ShowSuperHidden -Value 0; Stop-Process -Name explorer -Force

Dump Metadata of File/Folder : $p=Read-Host "Enter path"; Get-Item "$p" | Format-List *; Get-Acl "$p" | Format-List

List All Files (Recursive) : $p=Read-Host "Enter path"; Get-ChildItem "$p" -Recurse -Force

List Hidden Files : $p=Read-Host "Enter path"; Get-ChildItem "$p" -Recurse -Force | Where-Object { $_.Attributes -match "Hidden" }

List System Files : $p=Read-Host "Enter path"; Get-ChildItem "$p" -Recurse -Force | Where-Object { $_.Attributes -match "System" }

Unlock File Attributes (remove R/H/S) : $p=Read-Host "Enter path"; attrib -r -h -s "$p" /s /d

Delete File/Folder (No Recycle Bin) : $p=Read-Host "Enter path"; Remove-Item "$p" -Recurse -Force -Confirm:$false

Disable USB Storage : Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR" -Name Start -Value 4

Enable USB Storage : Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR" -Name Start -Value 3

Toggle File Extensions : $v=(Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced").HideFileExt; Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name HideFileExt -Value ($v -bxor 1); Stop-Process -Name explorer -Force
